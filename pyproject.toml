[project]
name = "cdcpipe"
version = "1.0.0"
description = "CDC ingestion pipeline demo with data-quality checks, quarantine and KPI layer"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "duckdb>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
